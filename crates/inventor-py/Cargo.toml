[package]
name = "inventor-py"
version.workspace = true
edition = "2021"
description = "Python bindings for the Inventor reader and part writer"
license.workspace = true
readme.workspace = true
publish = false

[lib]
name = "_inventor"
crate-type = ["cdylib"]

[dependencies]
inventor-core = { path = "../inventor-core" }
acis-py-bridge.workspace = true
pyo3.workspace = true
serde_json.workspace = true
serde.workspace = true

[features]
default = ["analytic-writer"]
analytic-writer = ["inventor-core/analytic-writer"]
iam-writer = ["inventor-core/iam-writer"]
