[package]
name = "inventor-core"
version = "0.7.0"
edition = "2021"
description = "Bounded Inventor reader and single-solid IPT writer"
license.workspace = true
readme.workspace = true

[features]
default = ["analytic-writer"]
fuzzing = []
# Bounded exact analytic part writer.
analytic-writer = []

[dependencies]
acis-core.workspace = true
cfb = "0.14.0"
flate2 = "1.1.9"
zstd = "0.13.3"
serde.workspace = true
encoding_rs = "0.8.35"
crc32fast = "1.5"
sha2 = "0.10.9"
serde_json = { workspace = true, features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json.workspace = true
