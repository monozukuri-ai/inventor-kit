[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "inventor-kit"
version = "0.5.0"
description = "Bounded Rust Inventor part carrier reader with shared ACIS models"
requires-python = ">=3.11"
dependencies = ["cq-acis>=0.3.8,<0.4"]
license = "PolyForm-Noncommercial-1.0.0 AND MIT AND Apache-2.0 AND BSD-3-Clause AND CC-BY-4.0 AND Zlib"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md", "THIRD_PARTY_NOTICES.md", "licenses/*.txt", "licenses/*.md", "licenses/*.json"]
readme = "README.md"
maintainers = [{name = "UnRobotics Inc."}]

[project.urls]
Repository = "https://github.com/monozukuri-ai/inventor-kit"
Licensing = "https://github.com/monozukuri-ai/inventor-kit/blob/main/docs/license.md"
Commercial = "https://www.un-robotics.com/#contact"

[project.optional-dependencies]
viewer = ["ocp-tessellate==3.5.1"]
validation = ["jsonschema>=4.23,<5", "olefile==0.46", "Pillow>=10,<13", "zstandard>=0.23,<1"]
oracle = ["jsonschema>=4.23,<5", "pywin32; sys_platform == 'win32'"]

[tool.maturin]
manifest-path = "crates/inventor-py/Cargo.toml"
module-name = "inventor_kit._inventor"
python-source = "python"
features = ["pyo3/extension-module"]
exclude = ["internal/**", "fixtures/public/**", "reports/**", "target/**", "fuzz/**"]
include = [
    {path = "python/inventor_kit/viewer/static/**", format = ["wheel", "sdist"]},
    {path = "viewer/src/*", format = "sdist"},
    {path = "viewer/scripts/*", format = "sdist"},
    {path = "viewer/tests/*", format = "sdist"},
    {path = "viewer/*.json", format = "sdist"},
    {path = "viewer/*.ts", format = "sdist"},
    {path = "viewer/index.html", format = "sdist"},
    {path = "schemas/viewer-scene-v1.schema.json", format = "sdist"},
    {path = "schemas/drawing-scene-v1.schema.json", format = "sdist"},
    {path = "schemas/drawing-report-v1.schema.json", format = "sdist"},
    {path = "tests/data/drawing-linetype-controls.json", format = "sdist"},
    {path = "schemas/conversion-report-v1.schema.json", format = "sdist"},
    {path = "README.ja.md", format = "sdist"},
    {path = "CONTRIBUTING.md", format = "sdist"},
    {path = "CLA.md", format = "sdist"},
    {path = "viewer/LICENSE.txt", format = "sdist"},
    {path = "scripts/check_license.py", format = "sdist"},
    {path = "scripts/sync_license_notices.py", format = "sdist"},
    {path = "docs/format-reference*.md", format = "wheel"},
    {path = "docs/*.md", format = "sdist"},
    {path = "schemas/vendor-oracle-v1.schema.json", format = "sdist"},
    {path = "schemas/drawing-oracle-v1.schema.json", format = "sdist"},
    {path = "python/inventor_kit/capabilities.json", format = "sdist"},
]
