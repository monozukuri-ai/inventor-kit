[workspace]
members = ["crates/inventor-core", "crates/inventor-py"]
resolver = "2"

[workspace.package]
version = "0.8.0"
license = "PolyForm-Noncommercial-1.0.0 AND MIT"
readme = "README.md"

[workspace.dependencies]
acis-core = "=0.3.12"
acis-py-bridge = "=0.3.12"
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
